[package]
name = "pyroscope-python-benchmarks"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[features]
default = []
profiling = ["dep:pyroscope", "dep:prost"]

[dependencies]
criterion = "0.8.2"
kindasafe_init.workspace = true
pyo3.workspace = true
pyroscope-pprof = { path = "../pprof" }
pyroscope-python-resolve = { path = "../python-resolve" }
pyroscope-python-unwind = { path = "../python-unwind" }
prost = { version = "0.14", optional = true }
pyroscope = { version = "2.1.5", default-features = false, features = ["backend-pprof-rs"], optional = true }

[[bench]]
name = "signal_stack"
harness = false

[build-dependencies]
pyo3-build-config.workspace = true
