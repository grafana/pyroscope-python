[package]
name = "pyroscope-python-offsets"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[dependencies]
pyo3-ffi = { version = "=0.30.1", features = ["extension-module"] }

[build-dependencies]
cc = "1"
pyo3-build-config = { version = "=0.30.1", features = ["resolve-config"] }
