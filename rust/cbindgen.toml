language = "C"
documentation_style = "C"

style = "type"

include_guard = "PYROSCOPE_FFI_H_"
include_version = false

header = "/* Licensed under Apache-2.0 */"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

braces = "SameLine"
tab_width = 2
line_length = 80

[parse]
parse_deps = false

[export]
include = [
  "FFIInternedString",
  "FFIStringView",
  "FFIFrame",
  "FFIHeapSampleValues",
  "FFISample",
  "pyroscope_memprof_string_table_intern_string",
  "pyroscope_memprof_push_sample",
]
exclude = [
  "memalloc_start",
  "memalloc_stop",
  "memalloc_heap_py",
]
