language = "C"
documentation_style = "C"

style = "type"

include_guard = "PYROSCOPE_FFI_H_"
include_version = false

header = "/* Licensed under Apache-2.0 */"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

braces = "SameLine"
tab_width = 2
line_length = 80

[enum]
prefix_with_name = true

[parse]
parse_deps = false

[export]
include = [
  "FFIInternedString",
  "FFIStringView",
  "FFIFrame",
  "FFISampleValues",
  "pyroscope_string_table_intern_utf8",
  "pyroscope_string_table_intern_ascii",
  "PprofBuilderType",
  "pyroscope_push_sample",
]
exclude = [
  "memalloc_start",
  "memalloc_stop",
  "memalloc_heap_py",
  "pyroscope_stack_bump_upload_seq",
  "pyroscope_stack_configure",
  "pyroscope_stack_fast_copy_initialized",
  "pyroscope_stack_interval_us",
  "pyroscope_stack_is_safe_copy_failed",
  "pyroscope_stack_pause_sampling",
  "pyroscope_stack_resume_sampling",
  "pyroscope_stack_uninstall_segv_handler",
  "pyroscope_stack_reinstall_segv_handler",
  "pyroscope_stack_start",
  "pyroscope_stack_stop",
  "pyroscope_stack_take_sampling_thread_error",
  "pyroscope_stack_upload_seq",
  "pyroscope_stack_register_thread",
  "pyroscope_stack_unregister_thread",
  "pyroscope_stack_thread_count",
  "pyroscope_stack_thread_asyncio_loop",
  "pyroscope_stack_init_asyncio",
  "pyroscope_stack_track_asyncio_loop",
  "pyroscope_stack_link_tasks",
  "pyroscope_stack_weak_link_tasks",
  "pyroscope_stack_set_uvloop_mode",
]
