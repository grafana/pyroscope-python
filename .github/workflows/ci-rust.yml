name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: cargo fmt --check
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Run formatting check
        run: cargo fmt --all --check
        working-directory: rust

  # The memory profiler compiles a version-specific view of CPython's internal
  # struct layouts, selected by cfgs that build.rs derives from the interpreter
  # pyo3-build-config finds. Pin that interpreter explicitly and cover every
  # supported version: without this the runner's default Python decides which
  # arm gets compiled, and the ones we ship would go unchecked.
  clippy:
    name: cargo clippy (py${{ matrix.python-version }})
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run clippy
        run: |
          set -euo pipefail
          export PYO3_PYTHON="$(which python)"
          cargo clippy --all-targets --no-default-features -- --deny warnings
          export Python3_ROOT_DIR=$(python -c 'import sys, pathlib; print(pathlib.Path(sys.base_prefix).resolve())')
          export Python3_EXECUTABLE="$PYO3_PYTHON"
          cargo clippy --all-targets --all-features -- --deny warnings
        working-directory: rust

  test:
    name: cargo test (${{ matrix.arch.name }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        arch:
          - name: x64
            runner: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
          - name: arm64
            runner: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests without memory profiling
        run: |
          set -euo pipefail
          export PYO3_PYTHON="$(which python)"
          cargo test --locked --no-default-features
        working-directory: rust

      - name: Run tests with memory profiling
        run: |
          set -euo pipefail
          export PYO3_PYTHON="$(which python)"
          export Python3_ROOT_DIR=$(python -c 'import sys, pathlib; print(pathlib.Path(sys.base_prefix).resolve())')
          export Python3_EXECUTABLE="$PYO3_PYTHON"
          cargo test --locked --all-features
        working-directory: rust

  miri:
    name: cargo miri
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly-2026-07-11
          components: miri, rust-src

      # Pinned so the CPython-version-specific arms Miri interprets are the
      # ones we ship, rather than whatever the runner defaults to.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Run library tests under Miri
        run: |
          set -euo pipefail
          export PYO3_PYTHON="$(which python)"
          cargo miri test --locked --lib --no-default-features
        working-directory: rust
