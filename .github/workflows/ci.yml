name: Python Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-generated-ffi:
    name: Check generated FFI files
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: 3.11
      - run: cargo install cbindgen --locked --version 0.29.3
      - run: python -m pip install cffi
      - run: make ffi/python/header
      - run: git diff --exit-code

  python-linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            make-target: linux/amd64
          - name: manylinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            make-target: linux/arm64
          - name: musllinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            make-target: musllinux/amd64
          - name: musllinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            make-target: musllinux/arm64
    name: Python Linux Build - ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - run: make ${{ matrix.make-target }}

      - name: Check wheel tags
        run: |
          set -euxo pipefail
          for whl in dist/*.whl; do
              echo "Wheel: $whl"
              unzip -p "$whl" '*.dist-info/WHEEL'
              unzip -p "$whl" '*.dist-info/WHEEL' | grep -qE 'Tag:.*(manylinux|musllinux)' || { echo "ERROR: expected manylinux or musllinux tag not found"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ matrix.name }}.whl"
          path: dist/*

  python-linux-integration-test-discover:
    name: Python Linux Integration Test Discover
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod
      - name: Generate test matrix
        id: tests
        run: echo "tests=$(make ci-matrix)" >> "$GITHUB_OUTPUT"
        working-directory: integration-test

  python-linux-test:
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.python-linux-integration-test-discover.outputs.tests) }}
        PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        variant:
          [
            "manylinux-amd64",
            "manylinux-arm64",
            "musllinux-amd64",
            "musllinux-arm64",
          ]
        include:
          - variant: manylinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            image-suffix: slim
            wheel-target: linux/amd64
          - variant: manylinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            image-suffix: slim
            wheel-target: linux/arm64
          - variant: musllinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            image-suffix: alpine
            wheel-target: musllinux/amd64
          - variant: musllinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            image-suffix: alpine
            wheel-target: musllinux/arm64
        exclude:
          # python:3.10/3.11-alpine arm64 tests hang indefinitely
          # tracked in https://github.com/grafana/pyroscope-rs/issues/365
          - variant: musllinux-arm64
            PYTHON_VERSION: "3.10"
          - variant: musllinux-arm64
            PYTHON_VERSION: "3.11"
    needs: ["python-linux-integration-test-discover", "python-linux-build"]
    name: Python Linux Test - ${{ matrix.test }} - ${{ matrix.variant }} - ${{ matrix.PYTHON_VERSION }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: "${{ matrix.variant }}.whl"
          path: dist
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod
      - run: go test -v -timeout 20m -count=1 -run '^${{ matrix.test }}$' .
        working-directory: integration-test
        env:
          PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
          PYTHON_IMAGE_SUFFIX: ${{ matrix.image-suffix }}
          PYROSCOPE_WHEEL_TARGET: ${{ matrix.wheel-target }}

  python-linux-configuration-test:
    name: Python Linux Configuration Test - ${{ matrix.configuration }}
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release, asan, tsan]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Reduce ASLR entropy for TSan
        if: matrix.configuration == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build test image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file docker/test.Dockerfile \
            --build-arg BUILD_CONFIG=${{ matrix.configuration }} \
            --cache-from type=gha,scope=python-native-${{ matrix.configuration }} \
            --cache-to type=gha,mode=max,scope=python-native-${{ matrix.configuration }} \
            --load \
            --tag pyroscope-python-test:${{ matrix.configuration }} \
            .

      - name: Extract test wheel
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/pyroscope-wheel-${{ matrix.configuration }}"
          mkdir -p "${wheel_dir}"
          container_id="$(docker create pyroscope-python-test:${{ matrix.configuration }})"
          trap 'docker rm -f "${container_id}" >/dev/null' EXIT
          docker cp "${container_id}:/wheels/." "${wheel_dir}/"
          echo "PYROSCOPE_TEST_WHEEL_DIR=${wheel_dir}" >> "${GITHUB_ENV}"

      - name: Run Rust unit tests
        run: |
          docker run --rm \
            pyroscope-python-test:${{ matrix.configuration }} \
            make test/unit/${{ matrix.configuration }} PYTHON=/usr/local/bin/python3

      - name: Check extension linkage
        run: |
          docker run --rm \
            pyroscope-python-test:${{ matrix.configuration }} \
            sh -euc '
              python3 -m pip install --no-index --find-links /wheels pyroscope-io
              extension="$(python3 -c "import pyroscope._native as native; print(native.__file__)")"
              if nm --defined-only "${extension}" | grep -Eq " (Py_Initialize|_PyRuntime)"; then
                echo "CPython runtime symbols were bundled into ${extension}" >&2
                exit 1
              fi
              case "${PYROSCOPE_SANITIZER:-}" in
                address) nm -D --undefined-only "${extension}" | grep -q __asan_ ;;
                thread) nm -D --undefined-only "${extension}" | grep -q __tsan_ ;;
              esac
            '

      - name: Run integration tests
        run: go test -v -timeout 40m -count=1 .
        working-directory: integration-test
        env:
          PYTHON_IMAGE: pyroscope-python-test:${{ matrix.configuration }}
          PYROSCOPE_WHEEL_DIR: ${{ env.PYROSCOPE_TEST_WHEEL_DIR }}
          PYROSCOPE_WHEEL_PATTERN: "*.whl"
          PYROSCOPE_WHEEL_TARGET: linux/amd64

  sdist-build:
    name: sdist
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -c "import pyroscope"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "sdist.whl"
          path: dist/*

  python-macos-build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-apple-darwin
            mk-arch: amd64
            macos-version: "14"
          - target: aarch64-apple-darwin
            mk-arch: arm64
            macos-version: "14"

    name: Python macOS - ${{ matrix.target }} - ${{ matrix.python-version }}
    runs-on: macos-${{ matrix.macos-version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install build wheel
      - run: make mac/${{ matrix.mk-arch }}

      - name: Check wheel tags
        run: |
          set -euxo pipefail
          for whl in dist/*.whl; do
              echo "Wheel: $whl"
              unzip -p "$whl" '*.dist-info/WHEEL'
              unzip -p "$whl" '*.dist-info/WHEEL' | grep -qE 'Tag:.*macosx_11_0_' || { echo "ERROR: expected macosx_11_0 tag not found"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}-python-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist/*
