name: Python Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-generated-ffi:
    name: Check generated FFI files
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: 3.11
      - run: cargo install cbindgen --locked --version 0.29.3
      - run: python -m pip install cffi
      - run: make ffi/python/header
      - run: git diff --exit-code

  python-linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            make-target: linux/amd64
          - name: manylinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            make-target: linux/arm64
          - name: musllinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            make-target: musllinux/amd64
          - name: musllinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            make-target: musllinux/arm64
    name: Python Linux Build - ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - run: make ${{ matrix.make-target }}

      - name: Check wheel tags
        run: |
          set -euxo pipefail
          for whl in dist/*.whl; do
              echo "Wheel: $whl"
              unzip -p "$whl" '*.dist-info/WHEEL'
              unzip -p "$whl" '*.dist-info/WHEEL' | grep -qE 'Tag:.*(manylinux|musllinux)' || { echo "ERROR: expected manylinux or musllinux tag not found"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ matrix.name }}.whl"
          path: dist/*

  python-linux-integration-test-discover:
    name: Python Linux Integration Test Discover
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod
      - name: Generate test matrix
        id: tests
        run: echo "tests=$(make ci-matrix)" >> "$GITHUB_OUTPUT"
        working-directory: integration-test

  python-linux-test:
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.python-linux-integration-test-discover.outputs.tests) }}
        PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        variant:
          [
            "manylinux-amd64",
            "manylinux-arm64",
            "musllinux-amd64",
            "musllinux-arm64",
          ]
        include:
          - variant: manylinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            image-suffix: slim
            wheel-target: linux/amd64
          - variant: manylinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            image-suffix: slim
            wheel-target: linux/arm64
          - variant: musllinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            image-suffix: alpine
            wheel-target: musllinux/amd64
          - variant: musllinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            image-suffix: alpine
            wheel-target: musllinux/arm64
        exclude:
          # python:3.10/3.11-alpine arm64 tests hang indefinitely
          # tracked in https://github.com/grafana/pyroscope-rs/issues/365
          - variant: musllinux-arm64
            PYTHON_VERSION: "3.10"
          - variant: musllinux-arm64
            PYTHON_VERSION: "3.11"
    needs: ["python-linux-integration-test-discover", "python-linux-build"]
    name: Python Linux Test - ${{ matrix.test }} - ${{ matrix.variant }} - ${{ matrix.PYTHON_VERSION }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: "${{ matrix.variant }}.whl"
          path: dist
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod
      - run: go test -v -timeout 20m -count=1 -run '^${{ matrix.test }}$' .
        working-directory: integration-test
        env:
          PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
          PYTHON_IMAGE_SUFFIX: ${{ matrix.image-suffix }}
          PYROSCOPE_WHEEL_TARGET: ${{ matrix.wheel-target }}

  sdist-build:
    name: sdist
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -c "import pyroscope"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "sdist.whl"
          path: dist/*

  python-macos-build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-apple-darwin
            mk-arch: amd64
            runs-on: macos-15-intel
            pyroscope-arch: amd64
            pyroscope-sha256: ff380e029706f95262733d3b1225bf87059139176ae1ddcc17e93cd3d584c8a3
          - target: aarch64-apple-darwin
            mk-arch: arm64
            runs-on: macos-15
            pyroscope-arch: arm64
            pyroscope-sha256: 465f72bd963e7ad49e760af5fc174d73d9068b67f59da76196416a402fdf6827

    name: Python macOS - ${{ matrix.target }} - ${{ matrix.python-version }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod

      - run: python -m pip install build wheel
      - run: make mac/${{ matrix.mk-arch }}

      - name: Check wheel tags
        run: |
          set -euxo pipefail
          for whl in dist/*.whl; do
              echo "Wheel: $whl"
              unzip -p "$whl" '*.dist-info/WHEEL'
              unzip -p "$whl" '*.dist-info/WHEEL' | grep -qE 'Tag:.*macosx_11_0_' || { echo "ERROR: expected macosx_11_0 tag not found"; exit 1; }
          done

      - name: Download Pyroscope
        env:
          PYROSCOPE_ARCH: ${{ matrix.pyroscope-arch }}
          PYROSCOPE_SHA256: ${{ matrix.pyroscope-sha256 }}
          PYROSCOPE_VERSION: "2.0.6"
        run: |
          set -euxo pipefail
          archive="pyroscope_${PYROSCOPE_VERSION}_darwin_${PYROSCOPE_ARCH}.tar.gz"
          url="https://github.com/grafana/pyroscope/releases/download/v${PYROSCOPE_VERSION}/${archive}"
          mkdir -p "$RUNNER_TEMP/pyroscope"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$url"
          echo "${PYROSCOPE_SHA256}  $RUNNER_TEMP/$archive" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/pyroscope" pyroscope

      - name: Run integration tests
        run: make test
        working-directory: integration-test
        env:
          PYROSCOPE_BINARY: ${{ runner.temp }}/pyroscope/pyroscope
          PYROSCOPE_INTEGRATION_TEST_MODE: native
          PYROSCOPE_PYTHON_BINARY: python
          PYROSCOPE_WHEEL_DIR: ${{ github.workspace }}/dist
          PYROSCOPE_WHEEL_TARGET: mac/${{ matrix.mk-arch }}
          GO_TEST_TIMEOUT: 30m

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}-python-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist/*
