name: ASAN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      python-version:
        description: CPython version
        type: choice
        default: all
        options: [all, "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
      profiler:
        description: CPU profiler implementation
        type: choice
        default: all
        options: [all, py-spy, signal, stack]
      arch:
        description: Architecture
        type: choice
        default: all
        options: [all, amd64, arm64]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  asan-test:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        PYTHON_VERSION: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || (inputs.python-version && inputs.python-version != 'all') && format('["{0}"]', inputs.python-version) || '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]') }}
        profiler: ${{ fromJSON((inputs.profiler && inputs.profiler != 'all') && format('["{0}"]', inputs.profiler) || '["py-spy", "signal", "stack"]') }}
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || (inputs.arch && inputs.arch != 'all') && format('["{0}"]', inputs.arch) || '["amd64", "arm64"]') }}
    name: ASAN Test - ${{ matrix.profiler }} - ${{ matrix.arch }} - ${{ matrix.PYTHON_VERSION }}
    runs-on: ${{ matrix.arch == 'amd64' && (github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-24.04') || (github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: integration-test/go.mod
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly-2026-10-25
          components: rust-src
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev g++ make cmake pkg-config libssl-dev libffi-dev zlib1g-dev libbz2-dev liblzma-dev libsqlite3-dev libreadline-dev libncurses-dev libgdbm-dev uuid-dev
      - name: Identify CPython source and build environment
        id: cpython
        env:
          PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
        run: |
          commit=$(git ls-remote https://github.com/python/cpython.git "refs/heads/$PYTHON_VERSION" | cut -f1)
          test -n "$commit"
          {
            echo "commit=$commit"
            echo "directory=.tmp/cpython-asan/${PYTHON_VERSION//./}"
            echo "image=${ImageOS}-${ImageVersion}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cpython-cache
        with:
          path: |
            ${{ steps.cpython.outputs.directory }}/src
            ${{ steps.cpython.outputs.directory }}/install
          key: cpython-asan-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cpython.outputs.image }}-${{ matrix.PYTHON_VERSION }}-${{ steps.cpython.outputs.commit }}-${{ hashFiles('Makefile', '.github/workflows/asan.yml') }}
      - name: Build ASAN CPython
        if: steps.cpython-cache.outputs.cache-hit != 'true'
        env:
          ASAN_PYTHON_REF: ${{ matrix.PYTHON_VERSION }}
          CPYTHON_DIR: ${{ steps.cpython.outputs.directory }}
          CPYTHON_COMMIT: ${{ steps.cpython.outputs.commit }}
        run: |
          make asan/clone
          git -C "$CPYTHON_DIR/src" fetch --depth 1 origin "$CPYTHON_COMMIT"
          git -C "$CPYTHON_DIR/src" checkout --detach FETCH_HEAD
          make asan/python
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cpython-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.cpython.outputs.directory }}/src
            ${{ steps.cpython.outputs.directory }}/install
          key: ${{ steps.cpython-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> ../${{ steps.cpython.outputs.directory }}/target
          key: asan-${{ matrix.arch }}-${{ matrix.PYTHON_VERSION }}-${{ steps.cpython.outputs.image }}-${{ steps.cpython.outputs.commit }}-${{ hashFiles('scripts/asan-test.sh') }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Run ASAN tests
        env:
          PYROSCOPE_TEST_LOG_DIR: ${{ github.workspace }}/asan-results/processes
          PROFILER: ${{ matrix.profiler }}
          ASAN_PYTHON_REF: ${{ matrix.PYTHON_VERSION }}
        run: |
          mkdir -p asan-results
          set -o pipefail
          make asan/test 2>&1 | tee asan-results/test.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: asan-${{ matrix.profiler }}-${{ matrix.arch }}-${{ matrix.PYTHON_VERSION }}
          path: asan-results/
          if-no-files-found: warn
