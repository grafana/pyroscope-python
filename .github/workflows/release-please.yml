on:
  push:
    branches:
      - main

name: Release Please

jobs:
  release-please:
    name: Run release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0
        with:
          github_app: pyroscope-development-app

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: >-
            ${{ contains(github.event.head_commit.message, 'chore(main): release python') }}

  python-release-linux:
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            make-target: linux/amd64
          - name: manylinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            make-target: linux/arm64
          - name: musllinux-amd64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
            make-target: musllinux/amd64
          - name: musllinux-arm64
            runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
            make-target: musllinux/arm64
    name: Release python linux - ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - run: make ${{ matrix.make-target }}
      - name: Upload release artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/pyroscope*.whl --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.release-please.outputs.sha }}-python-${{ matrix.name }}
          path: dist/*

  python-release-macos:
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.99.1
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14

      - name: Build Python 3.10
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target/py3.10
        run: |
          python3.10 -m pip install build wheel
          make mac/amd64 mac/arm64 PYTHON=python3.10
      - name: Build Python 3.11
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target/py3.11
        run: |
          python3.11 -m pip install build wheel
          make mac/amd64 mac/arm64 PYTHON=python3.11
      - name: Build Python 3.12
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target/py3.12
        run: |
          python3.12 -m pip install build wheel
          make mac/amd64 mac/arm64 PYTHON=python3.12
      - name: Build Python 3.13
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target/py3.13
        run: |
          python3.13 -m pip install build wheel
          make mac/amd64 mac/arm64 PYTHON=python3.13
      - name: Build Python 3.14
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target/py3.14
        run: |
          python3.14 -m pip install build wheel
          make mac/amd64 mac/arm64 PYTHON=python3.14

      - name: Upload release artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/pyroscope*.whl --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.release-please.outputs.sha }}-python-macos
          path: dist/*

  python-release-sdist:
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: sdist
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Upload release artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/pyroscope_io-*.tar.gz --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.release-please.outputs.sha }}-python-sdist
          path: dist/*

  publish-pypi:
    permissions:
      id-token: write
    name: Publish to PyPI
    needs:
      - release-please
      - python-release-linux
      - python-release-macos
      - python-release-sdist
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.release-please.outputs.sha }}-python-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github-release:
    permissions:
      contents: write
    name: Publish GitHub release
    needs:
      - release-please
      - publish-pypi
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name='${{ needs.release-please.outputs.tag_name }}' \
            -f target_commitish='${{ needs.release-please.outputs.sha }}' \
            --jq .body > release-notes.md
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --draft=false \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md
