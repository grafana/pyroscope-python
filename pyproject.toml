[project]
name = "pyroscope-io"
version = "1.2.2" # x-release-please-version
description = "Pyroscope Python integration"
authors = [
    {name = "Tolya Korniltsev",email = "anatoly.korniltsev@grafana.com"}
]
license-files = [ "LICENSE" ]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
maintainers = [
    {name = "Tolyan Korniltsev", email = "anatoly.korniltsev@grafana.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]

[tool.setuptools.packages]
find = { where = ["python/"] }

[build-system]
requires = [
    "setuptools (>=83.0.0,<83.1.0)",
    "setuptools-rust (>=1.12.0,<2.0.0)",
]


build-backend = "setuptools.build_meta"
